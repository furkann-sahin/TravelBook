<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <clipPath id="appClip">
      <rect width="300" height="300" rx="68"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="68" fill="#1E2022"/>

  <!-- Orange arc — bottom right -->
  <circle cx="300" cy="300" r="160" fill="#C4501A" clip-path="url(#appClip)"/>
  <!-- Dark overlay circle — creates crescent -->
  <circle cx="320" cy="270" r="140" fill="#1E2022" clip-path="url(#appClip)"/>
  <!-- Subtle top-left glow -->
  <circle cx="10" cy="20" r="80" fill="#C4501A" opacity="0.13" clip-path="url(#appClip)"/>

  <!-- T crossbar -->
  <rect x="88" y="110" width="124" height="22" rx="11" fill="#FFFFFF"/>
  <!-- T stem -->
  <rect x="139" y="110" width="22" height="90" rx="11" fill="#FFFFFF"/>

  <!-- Pin teardrop -->
  <path d="M150 198 C128 198 114 212 114 228 C114 242 150 266 150 266 C150 266 186 242 186 228 C186 212 172 198 150 198Z" fill="#C4501A"/>
  <!-- Pin inner ring -->
  <circle cx="150" cy="227" r="12" fill="#1E2022"/>
  <!-- Pin center dot -->
  <circle cx="150" cy="227" r="5" fill="#C4501A"/>
</svg>
